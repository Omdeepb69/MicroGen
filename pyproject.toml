[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microgen-llm"
version = "1.0.2"
description = "Lightweight, modular, hardware-aware LLM inference engine & empirical research testbed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Omdeep Borkar", email = "omdeepborkar69@gmail.com" }
]
keywords = [
    "llm-inference",
    "pytorch",
    "kv-cache",
    "continuous-batching",
    "paged-attention",
    "tensor-parallelism",
    "quantization",
    "speculative-decoding",
    "fastapi",
    "cuda"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "httpx>=0.24.0",
    "rich>=12.0.0",
    "sse-starlette>=1.6.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "sse-starlette>=1.6.0"
]
gpu = [
    "accelerate>=0.20.0"
]
benchmark = [
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]
dev = [
    "pytest>=7.0.0",
    "build>=0.10.0"
]

[project.scripts]
microgen = "microgen.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["microgen*"]
